name: schedule_me
description: An offline-first personal scheduler for recurring household and personal tasks.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - lib/core/database/migrations/001_initial_schema.sql
    - lib/core/database/migrations/002_completion_status.sql
    - lib/core/database/migrations/003_task_end_date.sql
    - lib/core/database/migrations/004_task_occurrences.sql
    - lib/core/database/migrations/005_generic_task_activity.sql
    - lib/core/database/migrations/006_completion_anchored_recurrence.sql
    - lib/core/database/migrations/007_task_reminder_mute.sql
    - lib/core/database/migrations/008_task_icon.sql

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.5.0
  flutter_local_notifications: ^19.4.2
  flutter_timezone: ^4.1.1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.5.4
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^1.2.0
  timezone: ^0.10.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mockito: ^5.4.4
